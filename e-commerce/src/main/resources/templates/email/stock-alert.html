<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="content" style="text-align:center;padding:0;font-size:15px;line-height:1.6;color:#504137;">
        <div style="display:inline-block;background-color:#f9f6f0;border-radius:50%;padding:16px;margin-bottom:20px;">
            <span style="font-size:24px;">🔔</span>
        </div>
        <p style="margin:0 0 24px;">
            Mağazanızdaki bir ürünün stoğu kritik seviyeye ulaşmıştır.
        </p>
        <div style="background-color:#fffdf8;border:1px solid #7b4019;padding:24px;margin:24px 0;">
            <p style="margin:0;color:#8a7668;font-size:11px;text-transform:uppercase;letter-spacing:3px;">ÜRÜN ADI</p>
            <p style="margin:8px 0 0;color:#3d2b1f;font-size:18px;font-weight:600;font-family:'Cormorant Garamond','Times New Roman',Times,serif;" th:text="${productName}">Antika Vazo</p>
            
            <div style="margin:16px auto;width:30px;height:1px;background-color:#d2bf97;"></div>
            
            <p style="margin:0;color:#7b4019;font-size:24px;font-weight:600;">Kalan Stok: <span th:text="${currentStock}">0</span></p>
        </div>
        <p style="margin:0;color:#8a7668;font-size:14px;">Lütfen en kısa sürede stok güncellemesi yapınız.</p>
        <div style="text-align:center;margin:32px 0 10px;">
            <a href="https://canantika.com/admin/products" style="display:inline-block;background-color:#7b4019;color:#fffdf8;text-decoration:none;padding:14px 32px;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;border-radius:2px;font-family:-apple-system,sans-serif;">PANELE GİT</a>
        </div>
    </div>
</body>
</html>
