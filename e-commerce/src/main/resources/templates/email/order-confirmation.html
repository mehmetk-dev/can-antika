<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="content" style="text-align:center;padding:0;font-size:15px;line-height:1.6;color:#504137;">
        <p style="margin:0 0 24px;font-family:'Cormorant Garamond','Times New Roman',Times,serif;font-size:18px;font-style:italic;color:#66554b;">
            Siparişiniz başarıyla alınmış olup büyük bir özenle işleme konulmuştur.
        </p>
        <div style="background-color:#f9f6f0;border:1px solid #d2bf97;padding:24px;margin:32px 0;">
            <p style="margin:0;color:#8a7668;font-size:11px;text-transform:uppercase;letter-spacing:3px;">SİPARİŞ KODUNUZ</p>
            <p style="margin:12px 0 0;color:#7b4019;font-size:24px;font-weight:600;letter-spacing:4px;font-family:'Cinzel','Times New Roman',Times,serif;" th:text="${orderCode}">ORD-12345678</p>
        </div>
        <p style="margin:0;color:#8a7668;font-size:14px;">
            Siparişinizin durumunu "Hesabım" sayfasından veya Can Antika üzerinden takip edebilirsiniz.
        </p>
        <div style="text-align:center;margin:32px 0 10px;">
            <a href="https://canantika.com/hesabim/siparisler" style="display:inline-block;background-color:#7b4019;color:#fffdf8;text-decoration:none;padding:14px 32px;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;border-radius:2px;font-family:-apple-system,sans-serif;">SİPARİŞLERİME GİT</a>
        </div>
    </div>

</html>
