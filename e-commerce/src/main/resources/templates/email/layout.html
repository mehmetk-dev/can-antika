<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background-color:#f9f6f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#3d2b1f;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f9f6f0;padding:20px 0;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="background-color:#fffdf8;overflow:hidden;border:1px solid #e8e1d5;border-radius:4px;box-shadow:0 8px 24px rgba(123,64,25,0.04);">
                    <!-- Header -->
                    <tr>
                        <td style="padding:40px 30px 20px;text-align:center;">
                            <h1 style="margin:0;color:#7b4019;font-size:34px;font-weight:500;letter-spacing:6px;font-family:'Cinzel','Times New Roman',Times,serif;text-transform:uppercase;" th:text="${storeName}">CAN ANTİKA</h1>
                            <p style="margin:10px 0 0;color:#8a7668;font-size:14px;letter-spacing:2px;font-family:'Cormorant Garamond','Times New Roman',Times,serif;font-style:italic;">Geçmişin İzi, Geleceğin Mirası</p>
                            <div style="margin:24px auto 0;width:40px;height:1px;background-color:#d2bf97;"></div>
                        </td>
                    </tr>
                    <!-- Title and Body (fragment insert) -->
                    <tr>
                        <td style="padding:0 30px 30px;">
                            <h2 style="margin:0 0 20px;color:#3d2b1f;font-size:24px;font-weight:600;font-family:'Cormorant Garamond','Times New Roman',Times,serif;text-align:center;" th:text="${title}">Başlık</h2>
                            <div th:insert="~{${contentTemplate} :: content}"></div>
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td style="background-color:#f4efe6;padding:24px 30px;text-align:center;border-top:1px solid #e8e1d5;">
                            <p style="margin:0;color:#66554b;font-size:14px;line-height:1.5;font-family:'Cormorant Garamond','Times New Roman',Times,serif;font-style:italic;" th:text="${address}">Hüseyinağa Mah. Meşrutiyet Cad. Avrupa Pasajı No: 8 İç Kapı No: 7 Beyoğlu / İstanbul</p>
                            <p style="margin:10px 0 0;color:#8a7668;font-size:12px;letter-spacing:1px;font-family:-apple-system,sans-serif;"><a th:href="'mailto:' + ${contactEmail}" style="color:#7b4019;text-decoration:none;" th:text="${contactEmail}">destek@canantika.com</a></p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
