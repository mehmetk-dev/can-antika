<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="content" style="text-align:center;padding:0;font-size:15px;line-height:1.6;color:#504137;">
        <p style="margin:0 0 24px;font-family:'Cormorant Garamond','Times New Roman',Times,serif;font-size:18px;font-style:italic;color:#66554b;">
            Zarif parçanız güvenle paketlendi ve yola çıktı.
        </p>
        <div style="background-color:#f9f6f0;border:1px solid #d2bf97;padding:24px;margin:32px 0;">
            <table width="100%" cellpadding="8" cellspacing="0" style="font-size:14px;">
                <tr>
                    <td style="color:#8a7668;text-align:right;width:50%;font-size:13px;text-transform:uppercase;letter-spacing:1px;">SİPARİŞ NO:</td>
                    <td style="color:#3d2b1f;font-weight:600;text-align:left;" th:text="${orderCode}">ORD-123</td>
                </tr>
                <tr>
                    <td style="color:#8a7668;text-align:right;font-size:13px;text-transform:uppercase;letter-spacing:1px;">KARGO FİRMASI:</td>
                    <td style="color:#3d2b1f;font-weight:600;text-align:left;" th:text="${carrier}">Yurtiçi</td>
                </tr>
                <tr>
                    <td style="color:#8a7668;text-align:right;font-size:13px;text-transform:uppercase;letter-spacing:1px;">TAKİP NO:</td>
                    <td style="color:#7b4019;font-weight:600;letter-spacing:2px;font-size:15px;text-align:left;" th:text="${trackingNumber}">123456</td>
                </tr>
            </table>
        </div>
        <p style="margin:0;color:#8a7668;font-size:14px;">Aşağıdaki buton ile kargonuzu doğrudan takip edebilirsiniz.</p>
        <div style="text-align:center;margin:32px 0 10px;">
            <a th:href="${trackingUrl} ?: '#'" style="display:inline-block;background-color:#7b4019;color:#fffdf8;text-decoration:none;padding:14px 32px;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;border-radius:2px;font-family:-apple-system,sans-serif;">KARGO TAKİBİ</a>
        </div>
    </div>
</body>
</html>
